name: Build SniperGold V11 PRO - FIXED PROPS GREEN

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ULTRA CLEAN OLD
        run: |
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          ls -R app/src/main/java/ || true

      - name: Show gradle.properties - DEBUG
        run: |
          echo "=== gradle.properties content ==="
          cat gradle.properties
          echo ""
          echo "=== lines ==="
          wc -l gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK V11 PRO - FIXED PROPS
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK V11 FINAL GREEN
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V11-PRO-FINAL-GREEN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
