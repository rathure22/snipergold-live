name: Build SniperGold - CLEAN REPOSITORY - GREEN #17

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLEAN REPOSITORY - DELETE OLD rathure22
        run: |
          echo "=== BEFORE CLEAN ==="
          ls -R app/src/main/java/ || true
          echo ""
          echo "=== CLEANING ==="
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          rm -rf app/src/main/java/com/rathure22_bak
          rm -rf app/src/main/java/com/old
          git rm -rf app/src/main/java/com/rathure22 2>/dev/null || true
          git rm -rf app/src/main/java/com/rathure 2>/dev/null || true
          echo ""
          echo "=== AFTER CLEAN - SHOULD BE ONLY snipergold ==="
          ls -R app/src/main/java/ || true
          echo "Repository cleaned!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Show files
        run: |
          cat gradle.properties
          echo ""
          ls -lh app/src/main/java/com/snipergold/v9/ || true

      - name: Build APK - CLEAN REPOSITORY
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          find . -name "*.apk" -type f -ls
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK - CLEAN REPOSITORY GREEN
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-CLEAN-REPOSITORY-GREEN
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
