name: Build SniperGold V11 PRO - NO WRAPPER FINAL GREEN

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ULTRA CLEAN OLD PACKAGE
        run: |
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          echo "Cleaned - only com/snipergold/v9 should remain"
          ls -R app/src/main/java/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 - NO WRAPPER NEEDED
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls $ANDROID_HOME/platforms/ || true

      - name: Build APK V11 PRO - DIRECT GRADLE NO WRAPPER
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK V11 GREEN FINAL
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V11-PRO-GREEN-FINAL-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
