name: Build SniperGold V14 - FIX MANIFEST - GREEN #17 EXACT

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLEAN OLD - SAME AS GREEN #17 - 0s
        run: |
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          ls -R app/src/main/java/ || true

      - name: Set up JDK 17 - SAME AS GREEN #17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 - PINNED - SAME AS GREEN #17
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK - SAME AS GREEN #17 - 10s
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Show files - SAME AS GREEN #17
        run: |
          cat gradle.properties
          ls -R app/src/main/java/ || true
          ls -lh gradle/wrapper/ || true

      - name: Build APK - Jetpack Compose Canvas - SAME AS GREEN #17
        run: gradle assembleDebug --stacktrace

      - name: List APK - SAME AS GREEN #17
        run: |
          find . -name "*.apk" -type f -ls
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK - SAME AS GREEN #17
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V14-FIX-MANIFEST-GREEN-17-METHOD
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
