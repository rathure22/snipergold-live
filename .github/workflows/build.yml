name: Build SniperGold V11 PRO - GREEN 21S COMEBACK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ULTRA CLEAN OLD PACKAGE
        run: |
          echo "=== BEFORE ==="
          ls -R app/src/main/java/ || true
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          rm -rf app/src/main/java/com/rathure22/snipergold
          echo "=== AFTER ==="
          echo "Cleaned - only com/snipergold/v9 should remain"
          ls -R app/src/main/java/ || true
          echo "Should be only com/snipergold/v9"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - MANUAL GREEN METHOD
        run: |
          echo "Setting up SDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "SDK Ready"
          ls $ANDROID_HOME/platforms/ || true

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing - downloading..."
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/subprojects/wrapper/src/main/resources/gradle/wrapper/gradle-wrapper.jar || \
            wget -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/subprojects/wrapper/src/main/resources/gradle/wrapper/gradle-wrapper.jar || true
          fi
          ls -lh gradle/wrapper/ || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show project files
        run: |
          echo "=== BUILD.GRADLE ==="
          cat app/build.gradle | head -20
          echo ""
          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "LINES: $(wc -l < gradle.properties)"
          echo ""
          echo "=== MainActivity ==="
          ls -lh app/src/main/java/com/snipergold/v9/

      - name: Build APK V11 PRO - GREEN METHOD
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK
        run: |
          echo "=== FIND APK ==="
          find . -name "*.apk" -type f || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK V11 GREEN
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V11-PRO-GREEN-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
