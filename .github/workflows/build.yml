name: Build SniperGold - ULTRA CLEAN FIX 7s ERROR - SAME AS GREEN #17

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ULTRA CLEAN REPOSITORY - DELETE ALL OLD
        run: |
          echo "=== BEFORE ==="
          find app/src/main/java -type f -name "*.kt" | head -20
          ls -R app/src/main/java/com/ || true
          echo ""
          echo "=== DELETING OLD rathure22 ==="
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          rm -rf app/src/main/java/com/rathure22_bak
          rm -rf app/build
          rm -rf build
          rm -rf .gradle
          git rm -rf app/src/main/java/com/rathure22 2>/dev/null || true
          git rm -rf app/src/main/java/com/rathure 2>/dev/null || true
          echo ""
          echo "=== AFTER CLEAN - ONLY snipergold/v9 SHOULD REMAIN ==="
          find app/src/main/java -type f | sort
          ls -R app/src/main/java/com/ || true

      - name: Set up JDK 17 - SAME AS GREEN #17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 - SAME AS GREEN #17
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK - SAME AS GREEN #17
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Show files - SAME AS GREEN #17
        run: |
          echo "gradle.properties:"
          cat gradle.properties
          echo ""
          echo "MainActivity exists:"
          ls -lh app/src/main/java/com/snipergold/v9/MainActivity.kt
          wc -l app/src/main/java/com/snipergold/v9/MainActivity.kt

      - name: Build APK - ULTRA CLEAN - SAME AS GREEN #17
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          find . -name "*.apk" -type f -ls
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK - ULTRA CLEAN GREEN
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V16-ULTRA-CLEAN-FIX-7S-GREEN
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
