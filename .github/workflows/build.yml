name: Build SniperGold - V21 FULL JETPACK COMPOSE PRO - GREEN #17

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NUCLEAR CLEAN - SAME AS GREEN #17
        run: |
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/rathure
          rm -rf app/build build .gradle
          echo "Cleaned - only snipergold/v9 remains"
          find app/src/main/java -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Verify Full Compose
        run: |
          echo "MainActivity lines:"
          wc -l app/src/main/java/com/snipergold/v9/MainActivity.kt
          echo "Checking Canvas, Candle, Gold Tracker..."
          grep -q "Canvas" app/src/main/java/com/snipergold/v9/MainActivity.kt && echo "✓ Canvas found"
          grep -q "GOLD TRACKER" app/src/main/java/com/snipergold/v9/MainActivity.kt && echo "✓ Gold Tracker found"
          grep -q "RESISTANCE ZONE" app/src/main/java/com/snipergold/v9/MainActivity.kt && echo "✓ Resistance Zone found"

      - name: Build APK - FULL COMPOSE - GREEN #17 METHOD
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK - FULL JETPACK COMPOSE PRO
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V21-FULL-JETPACK-COMPOSE-PRO
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
