name: Build SniperGold - FINAL CLEAN OLD PACKAGE

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLEAN OLD PACKAGE - rathure22
        run: |
          echo "Cleaning old mixed framework files..."
          rm -rf app/src/main/java/com/rathure22
          rm -rf app/src/main/java/com/snipergold/v9/old
          rm -f index.html app_icon.png
          ls -R app/src/main/java/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Show files
        run: |
          cat app/build.gradle
          ls -lh app/src/main/java/com/snipergold/v9/

      - name: Build APK - Jetpack Compose Canvas
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          find . -name "*.apk" -ls
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-APK-FINAL-CLEAN
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
