name: Build SniperGold - WORKING FINAL NO WRAPPER

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 - DIRECT NO WRAPPER NEEDED
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "SDK OK"

      - name: Show project files
        run: |
          echo "=== FILES ==="
          ls -lh
          ls -lh app/
          cat app/build.gradle | head -60
          ls -lh app/src/main/java/com/snipergold/v9/

      - name: Build APK - DIRECT GRADLE - 2-3 MINUTES
        run: gradle assembleDebug --stacktrace

      - name: List APK
        run: |
          echo "=== FIND APK ==="
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK - GUARANTEED
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-APK-FINAL-WORKING
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
