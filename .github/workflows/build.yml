name: Build SniperGold - Jetpack Compose Canvas FINAL

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK - MANUAL NO TOOLS
        run: |
          echo "Setting up SDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" ||           yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls $ANDROID_HOME/platforms/ || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show project files - DEBUG
        run: |
          echo "=== APP BUILD.GRADLE ==="
          cat app/build.gradle | head -50
          echo ""
          echo "=== MainActivity exists? ==="
          ls -lh app/src/main/java/com/snipergold/v9/ || true

      - name: Build APK - Jetpack Compose Canvas - FULL BUILD
        run: ./gradlew assembleDebug --stacktrace --info
        # Dili 0s, dapat 2-3 minutes ni!

      - name: List APK files - DEBUG
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f || true
          ls -R app/build/outputs/ || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK Artifact - WILDCARD GUARANTEED
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-APK-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
