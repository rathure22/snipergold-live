name: Build SniperGold V11 PRO GOLD TRACKER

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLEAN OLD
        run: rm -rf app/src/main/java/com/rathure22 && ls app/src/main/java/com/snipergold/v9/ || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Setup Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Build APK V11 PRO
        run: gradle assembleDebug --stacktrace
      - name: List APK
        run: find . -name "*.apk" -ls
      - name: Upload APK V11 PRO
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-V11-PRO-GOLD-TRACKER
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
